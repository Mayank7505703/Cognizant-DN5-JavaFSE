<h1>{{ portalName }}</h1>

<p>
  This portal allows students to browse courses,
  enroll and manage their academic profile.
</p>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<hr>

<input
  type="text"
  placeholder="Search Course"
  [(ngModel)]="searchTerm">

<p>Searching for: {{ searchTerm }}</p>

<hr>

<h3>Statistics</h3>

<ul>
  <li>Courses Available: {{ coursesAvailable }}</li>
  <li>Enrolled: 3</li>
  <li>GPA: 3.8</li>
</ul>

<!--
[property] = One-way binding (Component → DOM)

[(ngModel)] = Two-way binding (DOM ↔ Component)
-->
