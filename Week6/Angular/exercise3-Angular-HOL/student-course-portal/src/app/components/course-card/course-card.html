<div
  appHighlight="lightblue"
  [ngClass]="cardClasses"
  [ngStyle]="{
    'border-left':'6px solid ' + getBorderColor(),
    'padding-left':'10px'
  }">

  <h3>{{ course.name }}</h3>

  <p>Code: {{ course.code }}</p>

  <p>Credits: {{ course.credits | creditLabel }}</p>

  <div [ngSwitch]="course.gradeStatus">
    <span *ngSwitchCase="'passed'" style="color:green">Passed</span>
    <span *ngSwitchCase="'failed'" style="color:red">Failed</span>
    <span *ngSwitchCase="'pending'" style="color:gray">Pending</span>
  </div>

  <br>

  <button (click)="toggleDetails()">
    Show Details
  </button>
  <button (click)="course.enrolled = !course.enrolled">
    {{ course.enrolled ? 'Unenroll' : 'Enroll' }}
  </button>

  <button (click)="toggleDetails()">
    {{ isExpanded ? 'Hide Details' : 'Show Details' }}
  </button>
  <div *ngIf="isExpanded">
    <p>Course ID: {{ course.id }}</p>
    <p>Status: {{ course.gradeStatus }}</p>
  </div>

</div>

<hr>
